name: Question
description: Ask a question about MPSM usage or functionality
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Have a question? We're here to help! Please check the documentation first:
        - [Installation Guide](https://github.com/abrahamahn/mpsm/blob/main/docs/INSTALLATION.md)
        - [README](https://github.com/abrahamahn/mpsm/blob/main/README.md)
        - [Documentation](https://github.com/abrahamahn/mpsm/tree/main/docs)

  - type: textarea
    id: question
    attributes:
      label: Your Question
      description: What would you like to know?
      placeholder: How do I...?
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Question Category
      description: What is your question about?
      options:
        - Installation/Setup
        - Usage/Commands
        - Configuration
        - Troubleshooting
        - Performance
        - Contributing
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide context for your question
      placeholder: |
        What have you tried?
        What documentation have you checked?

  - type: textarea
    id: environment
    attributes:
      label: Environment (if relevant)
      description: Your environment details
      placeholder: |
        OS: Windows 11
        Python: 3.11
        MPSM: 1.0.0

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      options:
        - label: I have checked the documentation
          required: true
        - label: I have searched existing issues
          required: true
