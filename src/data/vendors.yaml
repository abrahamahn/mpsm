# Centralized Vendor/Publisher Registry
# Single source of truth for all vendor information across MPSM
#
# Each vendor entry contains:
# - name: Display name for the vendor
# - patterns: Search patterns for path/metadata matching (lowercase)
# - folders: Expected folder names in AppData/ProgramData
# - executables: DAW/plugin manager executable patterns
# - daw_executables: DAW-specific executables (if applicable)
# - standalone_executables: Standalone plugin executables (if applicable)

vendors:
  # ============================================================================
  # MAJOR DAW MANUFACTURERS
  # ============================================================================

  steinberg:
    name: "Steinberg"
    patterns:
      - steinberg
      - cubase
      - nuendo
    folders:
      - Steinberg
    executables: []
    daw_executables:
      - Cubase*.exe
      - Nuendo*.exe

